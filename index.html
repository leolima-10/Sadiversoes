<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salvador Diversões | Máquinas de urso para o seu estabelecimento</title>
    <meta
      name="description"
      content="Instalamos máquinas de urso no seu estabelecimento em Salvador e região metropolitana e cuidamos de tudo: manutenção, brindes e operação. Renda extra para você, diversão para seus clientes."
    />
    <meta name="theme-color" content="#fff9e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11183a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />

    <!-- Open Graph. Ao publicar, troque /assets/og.jpg pela URL absoluta do seu domínio (ex.: https://seudominio.com.br/assets/og.jpg). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Salvador Diversões" />
    <meta property="og:title" content="Salvador Diversões | Máquinas de urso para o seu estabelecimento" />
    <meta
      property="og:description"
      content="Você cede o espaço. A gente cuida do resto. Máquinas de urso em Salvador e região metropolitana."
    />
    <meta property="og:image" content="/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salvador Diversões: máquinas de urso para o seu estabelecimento" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes carregadas sem bloquear a primeira pintura (display=swap mostra o texto na fonte do sistema até chegarem). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      />
    </noscript>
    <!-- Fonte pixelada só com os dígitos (text=0123456789, ~1 KB): numeração do FAQ. Link separado para o recorte não afetar a Jakarta. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&text=0123456789&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&text=0123456789&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
